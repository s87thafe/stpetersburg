[project]
name = "stpetersburg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Torben", email = "thaferkamp@gmx.de" }
]
requires-python = ">=3.9"
dependencies = [
    "ipykernel>=6.31.0",
    "kaleido==0.2.1",
    "matplotlib>=3.9.4",
    "nbformat>=5.10",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "plotly>=6.9,<7",
    "pytask>=0.5.5",
]

[project.scripts]
stpetersburg = "stpetersburg:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.pytask.ini_options]
paths = ["src/stpetersburg"]
